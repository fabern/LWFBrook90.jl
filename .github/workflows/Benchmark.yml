name: Benchmarks

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  benchmark:
    name: Compare model-simulation performance
    runs-on: ubuntu-latest
    steps:
      - uses: MilesCranmer/AirspeedVelocity.jl@action-v1
        with:
          julia-version: '1'
          job-summary: 'true'
